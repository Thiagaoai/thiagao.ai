<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Thumbnail REA</title>
<style>
  html,body { margin:0; width:1280px; height:720px; overflow:hidden; font-family:"DejaVu Sans", sans-serif; }
  .bg { position:absolute; inset:0;
        background:radial-gradient(700px 500px at 78% 40%, #1d4ed8 0%, transparent 65%),
                   radial-gradient(600px 400px at 10% 100%, #0e7490 0%, transparent 60%), #070b18; }
  .t { position:absolute; left:56px; top:150px; color:#fff; font-weight:900; font-size:132px; line-height:.95;
       letter-spacing:-3px; text-shadow:0 8px 0 #000, 0 0 40px rgba(0,0,0,.6); }
  .t .y { color:#facc15; }
  .tag { position:absolute; left:60px; top:470px; background:#a3e635; color:#0a0f1e; font-weight:900;
         font-size:46px; padding:12px 28px; border-radius:16px; transform:rotate(-2deg); }
  .win { position:absolute; right:70px; top:120px; width:470px; height:470px; border-radius:36px;
         background:#0b1226; border:6px solid #22d3ee; box-shadow:0 30px 90px rgba(0,0,0,.6); overflow:hidden; }
  .bar { height:52px; background:#16213f; display:flex; gap:12px; align-items:center; padding-left:22px; }
  .bar i { width:16px; height:16px; border-radius:50%; display:block; }
  .code { padding:26px 28px; font:28px/1.5 "DejaVu Sans Mono", monospace; color:#9aa6c7; }
  .code b { color:#facc15; } .code s { color:#22d3ee; text-decoration:none; }
</style>
</head>
<body>
<div class="bg"></div>
<div class="win">
  <div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
  <div class="code">fetch(<b>'/api/…'</b>)<br>method: <s>'POST'</s><br>body: {<br>&nbsp;&nbsp;email,<br>&nbsp;&nbsp;source<br>}</div>
</div>
<svg style="position:absolute;right:360px;top:330px" width="260" height="380" viewBox="-30 0 210 320">
  <rect x="70" y="20" width="12" height="40" rx="6" fill="#9aa6c7"/><circle cx="76" cy="16" r="14" fill="#22d3ee"/>
  <rect x="10" y="56" width="132" height="110" rx="34" fill="#e8edff"/><rect x="28" y="78" width="96" height="62" rx="22" fill="#0a0f1e"/>
  <circle cx="56" cy="109" r="12" fill="#22d3ee"/><circle cx="96" cy="109" r="12" fill="#22d3ee"/>
  <rect x="22" y="172" width="108" height="120" rx="30" fill="#cfd8f7"/><rect x="52" y="200" width="48" height="30" rx="10" fill="#22d3ee"/>
  <rect x="-14" y="182" width="30" height="90" rx="15" fill="#cfd8f7"/><rect x="136" y="150" width="30" height="90" rx="15" fill="#cfd8f7" transform="rotate(-35 151 195)"/>
</svg>
<div style="position:absolute;left:600px;top:470px;font-size:150px;transform:scaleX(-1)">🔍</div>
<div class="t">SEM<br><span class="y">CÓDIGO-</span><br><span class="y">FONTE</span></div>
</body>
</html>
